name: Zenodo DOI Release

on:
  release:
    types: [published]

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Notify Zenodo Webhook
      # Akan dihubungkan ke GitHub-Zenodo integration untuk minting DOI otomatis
      run: |
        echo "Creating immutable release for DOI minting..."
        echo "Tautan ke Zenodo: https://zenodo.org/account/settings/github/"

name: CI Pipeline (Tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: apps/web

    steps:
    - uses: actions/checkout@v4
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check (TypeScript)
      run: npm run tsc --noEmit --if-present
      
    - name: ESLint
      run: npm run lint --if-present
      
    - name: Build Next.js
      env:
        # Build only imports route modules (no DB queries; all DB routes are
        # force-dynamic/POST). A placeholder URL satisfies prisma.ts's import guard.
        DATABASE_URL: postgresql://user:password@localhost:5432/statslab_ci
      run: npm run build

name: Dataset Validation

on:
  push:
    paths:
      - 'packages/datasets/**'
      - 'apps/web/src/lib/datasetSchema.ts'
  pull_request:
    paths:
      - 'packages/datasets/**'
      - 'apps/web/src/lib/datasetSchema.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Schema Validator (Zod)
      run: npx tsx packages/datasets/validate.mts

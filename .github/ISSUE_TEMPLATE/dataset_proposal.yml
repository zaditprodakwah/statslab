name: 📊 Usulan Dataset Baru (Dataset Proposal)
description: Usulkan dataset JSON berkonteks Keislaman atau Pendidikan Matematika untuk disetorkan ke packages/datasets.
title: "[DATASET]: "
labels: ["dataset", "open-science"]
body:
  - type: markdown
    attributes:
      value: Usulkan dataset baru yang autentik dan terverifikasi (*Tabayyun*).
  - type: input
    id: dataset-title
    attributes:
      label: Judul / Topik Dataset
      placeholder: Dataset Distribusi Wakaf Produktif Madrasah 2026
    validations:
      required: true
  - type: textarea
    id: data-source
    attributes:
      label: Sumber Data & Verifikasi (*Tabayyun*)
      description: Dari mana data ini diperoleh dan bagaimana keabsahannya diverifikasi?
    validations:
      required: true
